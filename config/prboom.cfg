# ZyperOS's base settings for PrBoom, the Doom shelf's core.
#
# The core reads this as its base (-baseconfig) from Bios/prboom/prboom.cfg,
# where ZyperOS copies it at every start when it has changed. A value set
# here becomes the default, so a game's own prboom.cfg (Saves/<game>/
# prboom.cfg, which the core writes as you play) keeps only what you changed.
#
# To set your own for every Doom game, put a prboom.cfg in Roms/Doom: the core
# looks beside the WAD first and does not read this one then. For one game,
# Roms/Doom/<game>.prboom.cfg (doom2.prboom.cfg for doom2.wad).
#
# Format: one setting a line, its name and value. Lines starting with '#'
# are comments.

# Run without holding a button, as most ports play by default. Y (Run) walks
# while held. The d-pad turns at the original game's keyboard speeds, twice
# as fast running as walking (ZyperOS's core, mk/patches/prboom-turn-speed.patch).
autorun                   1
