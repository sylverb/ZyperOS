# make check on every pull request and on main: the whole offline suite
# (Makefile CHECKS, Diatom's included) on Linux. A failure keeps
# build-native/check-logs as an artifact: one log a check, the failing one
# printed in the job's output as well.
#
# Linux, not macOS, since 2026-11-17: GitHub has far fewer macOS runners, and
# the macOS job sat in the queue for long and was cancelled before it started
# when several pull requests were open. Every check runs on Linux (the host
# launcher with SDL's dummy drivers, the pages in the runner's Chrome); the
# one that needs a Mac, check-simulator (the Swift simulator's tests), has a
# macOS job of its own, a few minutes long.
name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: SDL2, SQLite, xz, ALSA, curl and OpenSSL for the host launcher, Diatom and the checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev \
            libsqlite3-dev liblzma-dev zlib1g-dev libasound2-dev libcurl4-openssl-dev libssl-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pillow for the image checks
        run: python -m pip install Pillow

      - name: make check
        run: make check

      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: build-native/check-logs/

  # The simulator's tests (check-simulator: Swift, AppKit's world), the one
  # check that needs a Mac. make check skips it where there is no Swift.
  simulator:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: make check-simulator
        run: make check-simulator

  # The device files the host job never compiles: the launcher's for the
  # GKD Pixel 2 and the TrimUI Brick with their profiles, and Diatom's ports,
  # syntax only against Ubuntu's headers (make check-device-compile), so a
  # device nobody is holding still fails here when it stops building.
  devices:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Headers for SDL2, EGL, GLES, GBM, DRM, ALSA and SQLite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev \
            libegl-dev libgles-dev libgbm-dev libdrm-dev libasound2-dev libsqlite3-dev

      - name: make check-device-compile
        run: make check-device-compile
